# Prompts for the generated line-art library (docs/virtual-test-plan.md section 6).
# Read by scripts/nebius/library_job.py inside the Nebius Serverless Job.
#
# One style for every object, so the whole library looks like one hand drew it. `{subject}`
# is the object's entry in `subjects` below, or "a <object>" when it has none.

style: >-
  a clean line drawing of {subject}, thin even black lines, white background,
  no shading, no text, simple, centred

# Style test (1 Oct 2026). The pilot's `style` above gave detailed book illustrations
# (eyelashes, shading, hundreds of twigs: 120 to 400 pen strokes for eyes and trees). These
# ask for the neat, simple look of a kid's drawing done well. A set with `styles:` makes every
# object in each of them; the winner becomes `style`.
styles:
  icon: >-
    a simple outline icon of {subject}, bold even black outline, only a few inner lines,
    flat, no texture, no shading, white background, centred
  colouring: >-
    a page from a toddler's colouring book: {subject}, clean thick black outlines, big simple
    shapes, large empty white areas, no shading, no texture, centred
  doodle: >-
    a neat cute doodle of {subject}, drawn with one black felt-tip pen in a few smooth
    strokes, simple and friendly, no shading, white background, centred

negative: >-
  shading, hatching, cross-hatching, stippling, grey fill, solid black areas, filled black
  shapes, colour, gradient, texture, fur, hair strands, eyelashes, leaf texture, many small
  details, intricate, realistic, detailed illustration, shadow, text, letters, words,
  watermark, signature, frame, border, photo, photorealistic, 3d render, multiple objects,
  cropped, blurry

# Sampling. SANA 1600M model-card defaults: 20 steps, guidance 4.5, 1024 x 1024.
params:
  width: 1024
  height: 1024
  steps: 20
  guidance: 4.5
  seed_base: 1000  # image i of every object uses seed seed_base + i

# How the object is named in the prompt, where plain "a <object>" is vague.
subjects:
  ear: a human ear, side view
  eye: a human eye, front view, the pupil an open circle
  brain: a human brain, side view, a few smooth folds
  hand: an open human hand with five fingers, palm facing the viewer
  tree: a tree with a round fluffy crown and a straight trunk
  house: a little house with a pointed roof, a door and two windows
  cat: a sitting cat, front view
  flower: a flower with five round petals and a stem with two leaves
  dog: a sitting dog, front view
  car: a small car, side view
  bicycle: a bicycle, side view
  fish: a fish, side view
  bird: a small bird, side view
  # kids' favourites, added 1 Oct 2026 (rahul: "objects usually present in kids' drawings,
  # but drawn neatly")
  heart: a heart shape
  butterfly: a butterfly with open wings
  rainbow: a rainbow with a small cloud at each end
  balloon: a balloon on a string
  umbrella: an open umbrella
  rocket: a space rocket
  airplane: a small aeroplane
  train: a toy train engine
  bus: a school bus, side view
  kite: a diamond-shaped kite with a tail

sets:
  # 3 styles x 8 objects x 3 images (1 Oct 2026): pick the style before the full run
  style_test:
    per_object: 3
    max_minutes: 10
    styles: [icon, colouring, doodle]
    objects: [ear, eye, brain, hand, tree, house, cat, flower]
  # 5 hero-demo objects x 4 images: proves generation + centre-line tracing before the full run
  pilot:
    per_object: 4
    max_minutes: 15  # library_job.py stops by itself after this (the Job's own timeout is 1 h)
    objects: [ear, eye, brain, hand, tree]
  # every current library category (library/index.json) plus 30 kids' favourites, in the
  # two styles rahul chose on 1 Oct 2026: icon = a simple picture, colouring = a detailed one
  full:
    per_object: 6  # per style: 71 objects x 2 styles x 6 = 852 images
    max_minutes: 40
    styles: [icon, colouring]

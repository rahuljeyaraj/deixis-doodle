[project]
name = "deixis-doodle"
version = "0.1.0"
description = "Point and Draw: telling any robot *where* by speech and pointing (Nebius x NVIDIA Global AI Hackathon, Physical AI track)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.13"
authors = [{ name = "Rahul Jeyaraj" }]
dependencies = [
    "deixis[mcp]",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

# One optional group per workstream. Each session edits ONLY its own group
# (see docs/sessions/README.md). Install with: uv sync --extra <group>
[project.optional-dependencies]
controller = [
    "pyserial>=3.5",
    "pillow>=10",
]
vision = [
    "opencv-contrib-python>=4.8",
    "mediapipe>=0.10.14",
]
audio = [
    "sherpa-onnx>=1.12",
    "onnxruntime>=1.18",
    "sounddevice>=0.4.7",
    "av>=12",
]
agent = [
    "openai>=1.40",
]
drawing = [
    "pillow>=10",
    "vpype>=1.14",
    "opencv-contrib-python>=4.8",
]
cosmos = [
    "openai>=1.40",
    "opencv-contrib-python>=4.9",
]
ui = [
]
virtual = [
    "pyyaml>=6",
    "pillow>=10",
]
hwkit = [
    "opencv-contrib-python",
    "reportlab",
    "pypdfium2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pointdraw"]

[tool.uv]
# Use a uv-managed CPython, never the PlatformIO Python that is first on PATH.
python-preference = "only-managed"

[tool.uv.sources]
# The robot-agnostic core lives in its own repo (C:\work\deixis, MIT). Until it is public,
# use the local checkout next to this one; after that, a git tag (plan C20).
deixis = { path = "../deixis", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib -m 'not hardware and not network'"
markers = [
    "hardware: needs the plotter, camera, microphone or robot attached",
    "network: needs internet access, model downloads or API keys",
    "virtual: end-to-end scenes in the virtual world (no hardware, no keys; mock AI, text voice)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# deixis moved to its own repo (C:\work\deixis); keep its imports grouped with ours.
known-first-party = ["deixis", "pointdraw"]

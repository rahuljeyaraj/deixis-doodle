id: S6
title: "A tree, while pointing, without saying here"
tests: "pointing without a demonstrative: the last hold in [speech start - 2 s, speech end]"
lines:
  - at: 1.3
    text: "A tree."
hand:
  - {at: 0.2, enter: [150, -40]}
  - {move: [120, 60], dur: 0.6}
  - {hold: 1.6}
  - {leave: true}
expect:
  calls: [place_drawing]
  drawn:
    - {kind: object, label: tree, center: [120, 60], size: 40}
  asks: 0

id: S15
title: "The user draws a box, then: put a hand inside that"
tests: "the user's own mark: ink segmentation finds it, the Cosmos mock labels it, relation 'inside'"
events:
  - {at: 1.6, user_mark: {shape: square, at: [120, 75], size: 60, ink: black pen, label: box}}
lines:
  - at: 3.4
    text: "Put a hand inside that."
hand:
  - {at: 0.2, enter: [180, -40], pose: fist}
  - {move: [120, 75], dur: 0.5}
  - {hold: 1.3}
  - {pose: point, move: [118, 72], dur: 0.4}
  - {hold: 1.8}
  - {leave: true}
expect:
  calls: [place_drawing]
  drawn:
    - {kind: object, label: hand, inside: box, center: [120, 75], tol_mm: 5}
  asks: 0
